services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: job_agent
      POSTGRES_USER: job_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_agent -d job_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://job_agent:${POSTGRES_PASSWORD:-local-development-only}@db:5432/job_agent
      UPLOAD_DIR: /var/lib/job-agent/uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_RESUME_MODEL: ${OPENAI_RESUME_MODEL:-gpt-4.1-mini}
    volumes:
      - resume_uploads:/var/lib/job-agent/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    environment:
      API_BASE_URL: http://api:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_RESUME_MODEL: ${OPENAI_RESUME_MODEL:-gpt-4.1-mini}
      ENABLE_OPENAI_EMBEDDINGS: ${ENABLE_OPENAI_EMBEDDINGS:-false}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"

volumes:
  postgres_data:
  resume_uploads:
